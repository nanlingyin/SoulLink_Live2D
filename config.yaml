# SoulLink_Live2D 默认配置
# 所有配置统一在此文件维护

# 服务器配置
server:
  host: "0.0.0.0"
  port: 3000
  modelDirs:
    - "./l2d"

# LLM 配置
llm:
  # "local" 或 "api"
  mode: "api"

  # 本地模型配置（mode: local 时生效）
  local:
    baseModelPath: "./ct2model/models/qwen2.5-1.5b-instruct"
    loraModelPath: "./ct2model/output/l2d-motion-lora/final"
    device: "auto"
    temperature: 0.1
    maxNewTokens: 512

  # 远程 API 配置（mode: api 时生效）
  api:
    provider: "openai"
    apiKey: ""
    baseUrl: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    temperature: 0.7
    maxTokens: 500

    # 可选：表情生成专用配置（不填时继承 api 默认值）
    # expression:
    #   provider: "openai"
    #   apiKey: ""
    #   baseUrl: "https://api.openai.com/v1"
    #   model: "gpt-4o-mini"
    #   temperature: 0.7
    #   maxTokens: 500

    # 可选：聊天专用配置（不填时继承 api 默认值）
    # chat:
    #   provider: "openai"
    #   apiKey: ""
    #   baseUrl: "https://api.openai.com/v1"
    #   model: "gpt-4o-mini"
    #   temperature: 0.7
    #   maxTokens: 500

# 动画配置
animation:
  defaultDuration: 1000
  easing: "easeInOutCubic"
  autoResetDelay: 1500
  # 眼部开合参数是否二值化（只使用 min/max）
  eyeOpenBinary: false
  # 头部/手部/身体等关节参数增强倍率
  jointMotionBoost: 1.25

# 模型配置
model:
  directory: "./l2d"
  defaultScale: 0.8

# 界面配置
ui:
  showControlPanel: true
  showPhysicsParams: false
  defaultBackground: 0
  # auto / zh / en
  language: "auto"

# 语音配置（ASR + TTS）
voice:
  asr:
    enabled: true
    mode: "browser"
    language: "zh-CN"
    autoSend: true
    local:
      modelPath: "./models/whisper"
      modelSize: "base"

  tts:
    enabled: false
    baseUrl: "https://api.openai.com/v1"
    apiKey: ""
    model: "tts-1"
    voice: "alloy"
    speed: 1.0
