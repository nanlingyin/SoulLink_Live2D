# SoulLink Live2D 配置文件示例
# 复制此文件为 config.yaml 并填入你的实际配置

server:
  host: 0.0.0.0
  port: 3000
  modelDirs:
    - ./l2d

llm:
  # 模式: 'api' 使用在线API, 'local' 使用本地模型
  mode: api

  # 本地模型配置（mode: local 时使用）
  local:
    baseModelPath: ./ct2model/models/qwen2.5-1.5b-instruct
    loraModelPath: ./ct2model/output/l2d-motion-lora/final
    device: auto  # 'auto', 'cpu', 'cuda'
    temperature: 0.1
    maxNewTokens: 512

  # API 模式配置（mode: api 时使用）
  api:
    # 默认配置（expression 和 chat 会继承这些值）
    temperature: 0.1
    maxTokens: 800

    # 表情生成配置
    expression:
      provider: openai  # 'openai', 'deepseek', 'claude', 'ollama', 'siliconflow', 'custom'
      apiKey: YOUR_API_KEY_HERE
      baseUrl: https://api.openai.com/v1
      model: gpt-4o-mini
      temperature: 0.1
      maxTokens: 2000

    # 对话生成配置
    chat:
      provider: openai
      apiKey: YOUR_API_KEY_HERE
      baseUrl: https://api.openai.com/v1
      model: gpt-4o
      temperature: 0.5
      maxTokens: 5000

animation:
  defaultDuration: 1000  # 动画默认持续时间（毫秒）
  easing: easeInOutCubic  # 缓动函数
  autoResetDelay: 3000  # 自动重置延迟（毫秒）
  eyeOpenBinary: false  # 眼睛开合是否使用二值模式
  jointMotionBoost: 1.25  # 联合动作增强系数
  layeredParameters: true  # 启用分层参数
  ttsMotionKeepLipSync: true  # TTS 期间保持口型同步

model:
  directory: ./l2d  # Live2D 模型目录
  defaultScale: 0.8  # 默认缩放比例

ui:
  showControlPanel: true  # 显示控制面板
  showPhysicsParams: false  # 显示物理参数
  defaultBackground: 0  # 默认背景索引
  language: auto  # 'auto', 'zh', 'en'

# 实验性功能
experimental:
  # AI 图像生成（用于前景蒙版提取）
  imageGen:
    provider: openai  # 'openai', 'deepseek', 'custom'
    apiKey: YOUR_IMAGE_GEN_API_KEY_HERE
    baseUrl: https://api.openai.com/v1
    model: gpt-4o  # 支持图像生成的模型
    temperature: 0

voice:
  # 语音识别（ASR）
  asr:
    enabled: true
    mode: browser  # 'browser' 使用浏览器 Web Speech API, 'local' 使用本地 Whisper
    language: zh-CN
    autoSend: true  # 识别后自动发送
    local:
      modelPath: ./models/whisper
      modelSize: base  # 'tiny', 'base', 'small', 'medium', 'large'

  # 语音合成（TTS）
  tts:
    enabled: false
    baseUrl: https://api.openai.com/v1
    apiKey: YOUR_TTS_API_KEY_HERE
    model: tts-1
    voice: alloy  # 'alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer'
    speed: 1.0  # 语速 (0.25 - 4.0)
    lipSync:
      mouthOpenIntensity: 0.6  # 口型同步 - 嘴巴开合幅度 (0.0 - 1.0)
