<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulLink_Live2D - AI Live2D Expression Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>SL</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="background-layer"></div>
    <div class="blur-overlay"></div>

    <div id="chat-panel">
        <div class="chat-header">
            <h3 data-i18n="chat.title">AI Chat</h3>
            <div class="chat-header-buttons">
                <button onclick="clearChat()" data-i18n-title="chat.clear" title="Clear chat">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                </button>
                <button onclick="toggleChatPanel()" data-i18n-title="chat.minimize" title="Minimize">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-message system" data-i18n="chat.welcome">Welcome. Type a message to chat with AI and trigger expressions.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" data-i18n-placeholder="chat.input_placeholder" placeholder="Type your message..." onkeypress="handleChatKeyPress(event)">
            <button id="voice-btn" class="voice-btn" onclick="toggleVoiceRecording()" data-i18n-title="voice.input" title="Voice input">Mic</button>
            <button id="chat-send" onclick="sendChatMessage()" data-i18n="chat.send">Send</button>
        </div>
    </div>

    <button id="toggle-chat" onclick="toggleChatPanel()" data-i18n="chat.open">Open Chat</button>

    <div id="live2d-container">
        <div class="loading" id="loading">
            <div style="font-weight: 600;">SoulLink</div>
            <div style="margin-top: 10px; font-size: 14px; opacity: 0.8;" data-i18n="loading.model">Loading model...</div>
        </div>
        <canvas id="live2d-canvas"></canvas>
        <div class="controls">
            <button onclick="resetModel()" data-i18n="controls.reset_position">Reset Position</button>
            <button onclick="toggleBackground()" data-i18n="controls.toggle_background">Toggle Background</button>
        </div>
    </div>

    <button id="toggle-panel" onclick="toggleControlPanel()" data-i18n="controls.panel">Controls</button>

    <div id="control-panel">
        <h3>Loading...</h3>
        <p style="color: #86868b; font-size: 12px;" data-i18n="loading.waiting_model">Waiting for model initialization</p>
    </div>

    <div id="system-info">
        <strong>SoulLink</strong> -
        <span data-i18n="system.title">AI-driven Live2D expression control</span> |
        <span data-i18n="system.model_directory">Model directory</span>: <code>./l2d/</code> |
        <span style="opacity: 0.8;" data-i18n="system.drag_zoom">Drag model | Mouse wheel zoom</span>
        <span style="margin-left: 12px;">
            <label for="language-select" data-i18n="lang.label">Language</label>
            <select id="language-select" onchange="window.I18N && window.I18N.setLanguage(this.value)">
                <option value="zh">中文</option>
                <option value="en">English</option>
            </select>
        </span>
    </div>

    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <script src="js/services/config.js"></script>
    <script src="js/services/i18n.js"></script>
    <script src="js/services/asr.js"></script>
    <script src="js/services/tts.js"></script>
    <script src="js/live2d/loader.js"></script>
    <script src="js/services/expression.js"></script>
    <script src="js/services/websocket.js"></script>
    <script src="js/components/chat-panel.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.loadConfig) {
                await window.loadConfig();
            }
            if (window.I18N && typeof window.I18N.syncLanguageFromConfig === 'function') {
                window.I18N.syncLanguageFromConfig();
            }
            if (window.I18N) {
                window.I18N.applyPageTranslations();
            }

            const wsConnected = await initWebSocket();
            if (!wsConnected) {
                console.log('WebSocket unavailable, falling back to local mode');
                initLive2D();
            }

            initChat();
        });
    </script>
</body>
</html>
